#  Sea Green Theme (Raashid A. / Fixthecode) for VS Code
#  vers. 1.0.0
# ─────────────────────────────────────────────────────────────────────────

# ── Cursor & Selection Colours ───────────────────────────────────────────
[colors.cursor]
cursor = "#25a2a6"
text   = "#0a1018"

[colors.selection]
text       = "#25a2a6"
background = "#303e53"

# ── Primary Colours ───────────────────────────────────────────────────────
[colors.primary]
background = "#0a1018"
foreground = "#25a2a6"

# ── Normal Palette (ANSI) ────────────────────────────────────────────────
[colors.normal]
black   = "#151b25"
red     = "#FF5370"
green   = "#25a2a6"
yellow  = "#d8c569"
blue    = "#64B1CE"
magenta = "#e72c7a"
cyan    = "#25a2a6"
white   = "#7f8796"

# ── Font Settings ────────────────────────────────────────────────────────
[font]
size = 11.0

[font.bold]
family = "Gohu GohuFont"
style  = "Bold"

[font.bold_italic]
family = "Gohu GohuFont"
style  = "Bold Italic"

[font.italic]
family = "Gohu GohuFont"
style  = "Italic"

[font.normal]
family = "Gohu GohuFont"
style  = "Regular"

# ── Mouse & Environment ───────────────────────────────────────────────────
[mouse]
hide_when_typing = true

[env]
TERM = "xterm-256color"

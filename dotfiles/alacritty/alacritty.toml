# ─────────────────────────────────────────────────────────────────────────

# ── Cursor & Selection Colours ───────────────────────────────────────────
[colors.cursor]
cursor = "#a9b665"
text   = "#282828"

[colors.selection]
text       = "#a9b665"
background = "#45403d"

# ── Primary Colours ───────────────────────────────────────────────────────
[colors.primary]
background = "#282828"
foreground = "#a9b665"

# ── Normal Palette (ANSI) ────────────────────────────────────────────────
[colors.normal]
black   = "#32302f"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#d8a657"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#a89984"

# ── Font Settings ────────────────────────────────────────────────────────
[font]
size = 11.0

[font.bold]
family = "Gohu GohuFont"
style  = "Bold"

[font.bold_italic]
family = "Gohu GohuFont"
style  = "Bold Italic"

[font.italic]
family = "Gohu GohuFont"
style  = "Italic"

[font.normal]
family = "Gohu GohuFont"
style  = "Regular"

# ── Mouse & Environment ───────────────────────────────────────────────────
[mouse]
hide_when_typing = true

[env]
TERM = "xterm-256color"
